[project]
name = "kontur"
version = "0.3.0"
description = "Каталог электротоваров: автономный прототип Контур"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1,<2",
    "pydantic>=2.10,<3",
    "openai>=2,<3",
    "python-multipart>=0.0.20,<1",
    "openpyxl>=3.1,<4",
    "python-docx>=1.2,<2",
    "pypdf>=6.19,<7",
    "pillow>=11,<13",
    "defusedxml>=0.7,<1",
]

[project.scripts]
hack = "app.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
